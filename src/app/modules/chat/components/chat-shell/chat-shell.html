<div class="chat-wrap" [class.dark-mode]="isDarkMode">
    <!-- Overlay para mobile -->
    <div class="sidebar-overlay" 
         [class.active]="isMobile && sidebarOpen" 
         (click)="toggleSidebar()">
    </div>

    <aside class="chat-sidebar" [class.mobile-open]="sidebarOpen">
        <app-sidebar-ia 
            [ias]="iaList" 
            [active]="activeIa" 
            (select)="selectIa($event)"
            (toggle)="toggleSidebar()">
        </app-sidebar-ia>
    </aside>

    <main class="chat-main">
        <div class="chat-header">
            <button class="mobile-menu-btn" (click)="toggleSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="header-content">
                <h3>{{ getActiveIaName() }}</h3>
                <div class="header-actions">
                    <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Modo Claro' : 'Modo Escuro'">
                        <!-- Ícone do Sol (modo claro) -->
                        <svg *ngIf="!isDarkMode" class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M12 17C14.7614 17 17 14.7614 17 12C17 9.23858 14.7614 7 12 7C9.23858 7 7 9.23858 7 12C7 14.7614 9.23858 17 12 17Z" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 1V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M12 21V23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M4.22 4.22L5.64 5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M18.36 18.36L19.78 19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M1 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M21 12H23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M4.22 19.78L5.64 18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        
                        <!-- Ícone da Lua (modo escuro) -->
                        <svg *ngIf="isDarkMode" class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M21 12.79C20.8427 14.4922 20.2039 16.1144 19.1582 17.4668C18.1126 18.8192 16.7035 19.8458 15.0957 20.4265C13.4879 21.0073 11.748 21.1181 10.0794 20.7461C8.41082 20.3741 6.8829 19.5345 5.67422 18.3258C4.46555 17.1171 3.62593 15.5892 3.2539 13.9206C2.88187 12.252 2.9927 10.5121 3.57345 8.9043C4.1542 7.29651 5.18085 5.88737 6.53323 4.84175C7.88562 3.79614 9.5078 3.15731 11.21 3C10.2134 4.34827 9.73375 6.00945 9.85843 7.68141C9.98312 9.35338 10.7038 10.9251 11.8894 12.1106C13.0749 13.2962 14.6466 14.0169 16.3186 14.1416C17.9906 14.2662 19.6517 13.7866 21 12.79Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="chat-body">
            <app-message-list [messages]="messages"></app-message-list>
        </div>

        <div class="chat-footer">
            <app-message-input (sendMessage)="onSend($event)"></app-message-input>
        </div>
    </main>
</div>
