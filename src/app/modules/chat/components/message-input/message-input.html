<div class="message-input-container">
  <div class="input-wrapper">
    <div class="input-content">
      <input
        type="text"
        [(ngModel)]="message"
        placeholder="Digite sua mensagem..."
        (keyup.enter)="onSend()"
        #messageInput
      />
      <div class="input-actions">
        <button class="attach-btn" type="button" title="Anexar arquivo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M14.8284 12L16.2426 13.4142L12 17.6568L7.75736 13.4142L9.17157 12L11 13.8284V8H13V13.8284L14.8284 12Z" fill="currentColor"/>
            <path d="M19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H19C20.1046 3 21 3.89543 21 5V19C21 20.1046 20.1046 21 19 21Z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </div>
    <button 
      (click)="onSend()" 
      class="send-btn"
      [class.disabled]="!message"
      [attr.disabled]="!message ? true : null"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" 
              stroke="currentColor" 
              stroke-width="2" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  
  <div class="input-footer">
    <span class="hint-text">Pressione Enter para enviar</span>
  </div>
</div>
