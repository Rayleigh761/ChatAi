<div class="messages-container">
  <div class="messages">
    <div *ngFor="let m of messages" class="msg-row" [ngClass]="m.type">
      
      <!-- Mensagem Recebida -->
      <div class="message-content" *ngIf="m.type === 'received'">
        <div class="avatar">
          <div class="avatar-icon">
            {{ getAvatarIcon(m) }}
          </div>
        </div>
        
        <div class="bubble-container">
          <div class="bubble">
            <div class="message-text">{{ m.text }}</div>
            <div class="message-footer">
              <div class="message-time">{{ getMessageTime(m.timestamp) }}</div>
              <button class="copy-btn" (click)="copyToClipboard(m.text)" title="Copiar texto">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
                  <path d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mensagem Enviada -->
      <div class="message-content" *ngIf="m.type === 'sent'">
        <div class="bubble-container">
          <div class="bubble">
            <div class="message-text">{{ m.text }}</div>
            <div class="message-time">{{ getMessageTime(m.timestamp) }}</div>
          </div>
        </div>
      </div>

      <!-- Indicador de Digitando -->
      <div class="message-content" *ngIf="m.type === 'typing'">
        <div class="avatar">
          <div class="avatar-icon">
            {{ getAvatarIcon(m) }}
          </div>
        </div>
        
        <div class="bubble-container">
          <div class="bubble typing-bubble">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div #end class="scroll-anchor"></div>
  </div>
</div>
